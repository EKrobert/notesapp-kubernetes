# deploy-all.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: notes

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  namespace: notes
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS notes (
      id SERIAL PRIMARY KEY,
      note TEXT NOT NULL
    );

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: notes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-db
  namespace: notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-db
  template:
    metadata:
      labels:
        app: notes-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: notesuser
            - name: POSTGRES_PASSWORD
              value: notespass
            - name: POSTGRES_DB
              value: notesdb
          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: init-script
          configMap:
            name: db-init
        - name: data
          persistentVolumeClaim:
            claimName: db-data

---
apiVersion: v1
kind: Service
metadata:
  name: notes-db
  namespace: notes
spec:
  ports:
    - port: 5432
  selector:
    app: notes-db

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      containers:
        - name: api
          image: notes-api:latest
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: notes-api
  namespace: notes
spec:
  ports:
    - port: 5000
  selector:
    app: notes-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-frontend
  namespace: notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-frontend
  template:
    metadata:
      labels:
        app: notes-frontend
    spec:
      containers:
        - name: frontend
          image: notes-frontend:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: notes-frontend
  namespace: notes
spec:
  ports:
    - port: 80
  selector:
    app: notes-frontend

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes-ingress
  namespace: notes
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - host: notes.$(minikube ip -p minikube).nip.io
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: notes-api
                port:
                  number: 5000
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: notes-frontend
                port:
                  number: 80